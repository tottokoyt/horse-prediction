<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競走馬 回収率予測</title>
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #22263a;
    --border:    #2e334d;
    --accent:    #4f6ef7;
    --accent2:   #7c9aff;
    --text:      #e8eaf0;
    --text2:     #8891b0;
    --green:     #2dd4a0;
    --green-bg:  #0d2e24;
    --red:       #f26b6b;
    --red-bg:    #2e1212;
    --yellow:    #f5c842;
    --yellow-bg: #2e2512;
    --gray:      #8891b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .logo { font-size: 22px; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .02em; }
  header .sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 0;
    min-height: calc(100vh - 61px);
  }

  /* ── Form Panel ── */
  .form-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    overflow-y: auto;
  }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field input::placeholder { color: var(--text2); opacity: .6; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .scale-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 20px;
    margin-bottom: 20px;
  }
  .scale-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    cursor: pointer;
    user-select: none;
  }
  .scale-toggle input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .scale-toggle span { font-size: 13px; font-weight: 600; }
  .scale-fields { display: none; }
  .scale-fields.active { display: block; }

  .btn-predict {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, transform .1s;
    letter-spacing: .03em;
  }
  .btn-predict:hover { background: var(--accent2); }
  .btn-predict:active { transform: scale(.98); }
  .btn-predict:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Result Panel ── */
  .result-panel {
    padding: 32px;
    overflow-y: auto;
  }
  .placeholder {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    gap: 12px;
  }
  .placeholder .icon { font-size: 48px; opacity: .4; }
  .placeholder p { font-size: 14px; }

  /* ── Result Content ── */
  .result-content { display: none; }
  .result-content.active { display: block; }

  .result-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .badge-model {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text2);
  }
  .verdict-badge {
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 14px;
    font-weight: 700;
  }
  .verdict-badge.positive { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .verdict-badge.consider { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
  .verdict-badge.negative { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red); }
  .verdict-badge.neutral  { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }

  /* ── Prob Bars ── */
  .prob-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .prob-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .prob-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .prob-row:last-child { margin-bottom: 0; }
  .prob-label { font-size: 13px; width: 100px; flex-shrink: 0; }
  .prob-bar-wrap {
    flex: 1;
    background: var(--surface2);
    border-radius: 4px;
    height: 20px;
    overflow: hidden;
  }
  .prob-bar {
    height: 100%;
    border-radius: 4px;
    transition: width .6s cubic-bezier(.4,0,.2,1);
    width: 0;
  }
  .prob-bar.c0 { background: var(--red); }
  .prob-bar.c1 { background: var(--yellow); }
  .prob-bar.c2 { background: var(--green); }
  .prob-pct {
    font-size: 13px;
    font-weight: 700;
    width: 48px;
    text-align: right;
    flex-shrink: 0;
  }
  .prob-pct.c0 { color: var(--red); }
  .prob-pct.c1 { color: var(--yellow); }
  .prob-pct.c2 { color: var(--green); }
  .predicted-arrow {
    font-size: 11px;
    color: var(--accent2);
    width: 52px;
    flex-shrink: 0;
  }

  /* ── Factors ── */
  .factors-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .factors-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .factor-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .factor-row:last-child { border-bottom: none; }
  .factor-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .factor-dot.positive { background: var(--green); }
  .factor-dot.negative { background: var(--red); }
  .factor-dot.neutral  { background: var(--gray); }
  .factor-name { font-size: 13px; font-weight: 600; min-width: 160px; }
  .factor-value { font-size: 13px; color: var(--text2); }

  /* ── Loading ── */
  .loading {
    display: none;
    align-items: center;
    justify-content: center;
    height: 100%;
    flex-direction: column;
    gap: 16px;
    color: var(--text2);
  }
  .loading.active { display: flex; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ── */
  .error-box {
    display: none;
    background: var(--red-bg);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--red);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .error-box.active { display: block; }

  @media (max-width: 768px) {
    header { padding: 12px 16px; }
    header h1 { font-size: 16px; }
    header .sub { font-size: 11px; }

    .layout {
      grid-template-columns: 1fr;
      min-height: auto;
    }
    .form-panel {
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 20px 16px;
    }
    .result-panel { padding: 20px 16px; }

    /* iOS: font-size 16px prevents auto-zoom on focus */
    .field input, .field select {
      font-size: 16px;
      min-height: 44px;
    }
    .btn-predict {
      min-height: 50px;
      font-size: 16px;
    }

    /* Prob rows: tighter on narrow screens */
    .prob-label { width: 76px; font-size: 12px; }
    .prob-pct   { width: 38px; font-size: 12px; }
    .predicted-arrow { width: 34px; font-size: 10px; }
    .prob-row { gap: 8px; }

    /* Factors: dot+name on first line, value wraps below */
    .factor-row {
      flex-wrap: wrap;
      gap: 4px 8px;
    }
    .factor-dot { align-self: center; }
    .factor-name {
      min-width: unset;
      flex: 1;
      font-size: 12px;
    }
    .factor-value {
      width: 100%;
      padding-left: 16px;
      font-size: 12px;
    }

    .result-header { flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .badge-model   { font-size: 11px; }
    .verdict-badge { font-size: 13px; padding: 5px 14px; }
    .prob-section, .factors-section { padding: 16px; margin-bottom: 16px; }
    .placeholder p { font-size: 13px; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">🏇</span>
  <div>
    <h1>競走馬 回収率予測システム</h1>
    <div class="sub">一口馬主 回収率予測モデル（LightGBM v6）</div>
  </div>
</header>

<div class="layout">

  <!-- ── 入力フォーム ── -->
  <div class="form-panel">
    <div class="section-title">基本情報</div>

    <div class="field">
      <label>父馬名</label>
      <input type="text" id="sire" placeholder="例: キタサンブラック">
    </div>
    <div class="field">
      <label>調教師</label>
      <input type="text" id="trainer" placeholder="例: 木村哲也">
    </div>
    <div class="field">
      <label>生産牧場</label>
      <input type="text" id="farm" placeholder="例: ノーザンファーム">
    </div>

    <div class="row2">
      <div class="field">
        <label>性別</label>
        <select id="sex">
          <option value="">選択してください</option>
          <option value="牡">牡</option>
          <option value="牝">牝</option>
          <option value="セ">セン</option>
        </select>
      </div>
      <div class="field">
        <label>生まれ月</label>
        <select id="birth_month">
          <option value="">選択してください</option>
          <option value="1">1月</option>
          <option value="2">2月</option>
          <option value="3">3月</option>
          <option value="4">4月</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>募集総額（万円）</label>
      <input type="number" id="price" placeholder="例: 5000" min="0" step="100">
    </div>

    <!-- 測尺セクション -->
    <div class="scale-section">
      <label class="scale-toggle">
        <input type="checkbox" id="use-scale" onchange="toggleScale()">
        <span>測尺データを入力する（モデルA使用）</span>
      </label>
      <div class="scale-fields" id="scale-fields">
        <div class="row2">
          <div class="field">
            <label>体高（cm）</label>
            <input type="number" id="height" placeholder="例: 157.0" step="0.5">
          </div>
          <div class="field">
            <label>胸囲（cm）</label>
            <input type="number" id="chest" placeholder="例: 175.0" step="0.5">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>管囲（cm）</label>
            <input type="number" id="cannon" placeholder="例: 20.5" step="0.1">
          </div>
          <div class="field">
            <label>体重（kg）</label>
            <input type="number" id="weight" placeholder="例: 460" step="1">
          </div>
        </div>
      </div>
    </div>

    <button class="btn-predict" id="btn-predict" onclick="doPrediction()">予測する</button>
  </div>

  <!-- ── 結果パネル ── -->
  <div class="result-panel" id="result-panel">

    <div class="placeholder" id="placeholder">
      <div class="icon">🏇</div>
      <p>フォームに情報を入力して予測ボタンを押してください</p>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>予測中...</p>
    </div>

    <div id="result-area">
      <div class="error-box" id="error-box"></div>
      <div class="result-content" id="result-content">

        <div class="result-header">
          <span class="badge-model" id="badge-model">モデルB</span>
          <span class="verdict-badge" id="verdict-badge">---</span>
        </div>

        <div class="prob-section">
          <div class="prob-title">クラス別確率</div>
          <div class="prob-row">
            <span class="prob-label">100%未満</span>
            <div class="prob-bar-wrap"><div class="prob-bar c0" id="bar0"></div></div>
            <span class="prob-pct c0" id="pct0">0%</span>
            <span class="predicted-arrow" id="arrow0"></span>
          </div>
          <div class="prob-row">
            <span class="prob-label">100〜200%</span>
            <div class="prob-bar-wrap"><div class="prob-bar c1" id="bar1"></div></div>
            <span class="prob-pct c1" id="pct1">0%</span>
            <span class="predicted-arrow" id="arrow1"></span>
          </div>
          <div class="prob-row">
            <span class="prob-label">200%超</span>
            <div class="prob-bar-wrap"><div class="prob-bar c2" id="bar2"></div></div>
            <span class="prob-pct c2" id="pct2">0%</span>
            <span class="predicted-arrow" id="arrow2"></span>
          </div>
        </div>

        <div class="factors-section">
          <div class="factors-title">影響要因</div>
          <div id="factors-list"></div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
function toggleScale() {
  const cb = document.getElementById('use-scale');
  const fields = document.getElementById('scale-fields');
  fields.classList.toggle('active', cb.checked);
}

async function doPrediction() {
  const btn = document.getElementById('btn-predict');
  btn.disabled = true;

  // 表示切り替え
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('loading').classList.add('active');
  document.getElementById('result-content').classList.remove('active');
  document.getElementById('error-box').classList.remove('active');

  const useScale = document.getElementById('use-scale').checked;

  const body = {
    sire:        val('sire')        || null,
    trainer:     val('trainer')     || null,
    farm:        val('farm')        || null,
    sex:         val('sex')         || null,
    birth_month: intVal('birth_month'),
    price:       floatVal('price'),
    height:      useScale ? floatVal('height') : null,
    chest:       useScale ? floatVal('chest')  : null,
    cannon:      useScale ? floatVal('cannon') : null,
    weight:      useScale ? floatVal('weight') : null,
  };

  try {
    const res = await fetch('/predict', {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || `サーバーエラー (${res.status})`);
    }

    const data = await res.json();
    renderResult(data);

  } catch(e) {
    showError(e.message);
  } finally {
    document.getElementById('loading').classList.remove('active');
    btn.disabled = false;
  }
}

function renderResult(data) {
  // モデルバッジ
  const modelLabel = data.model_used === 'A'
    ? 'モデルA（測尺あり・精密版）'
    : 'モデルB（測尺なし・汎用版）';
  document.getElementById('badge-model').textContent = modelLabel;

  // 判定バッジ
  const verdictEl = document.getElementById('verdict-badge');
  verdictEl.textContent = data.verdict;
  verdictEl.className = 'verdict-badge ' + verdictClass(data.verdict);

  // 確率バー
  data.prob.forEach((p, i) => {
    const pct = (p * 100).toFixed(1);
    document.getElementById('bar' + i).style.width = pct + '%';
    document.getElementById('pct' + i).textContent = pct + '%';
    document.getElementById('arrow' + i).textContent =
      i === data.pred_class ? '← 予測' : '';
  });

  // ファクター
  const list = document.getElementById('factors-list');
  list.innerHTML = data.factors.map(f => `
    <div class="factor-row">
      <div class="factor-dot ${f.impact}"></div>
      <div class="factor-name">${f.name}</div>
      <div class="factor-value">${f.value}</div>
    </div>
  `).join('');

  document.getElementById('result-content').classList.add('active');

  // SP: scroll result panel into view after rendering
  if (window.innerWidth <= 768) {
    document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function verdictClass(v) {
  if (v === '有望候補') return 'positive';
  if (v === '検討候補') return 'consider';
  if (v === '見送り推奨') return 'negative';
  return 'neutral';
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = 'エラー: ' + msg;
  el.classList.add('active');
}

function val(id) { return document.getElementById(id).value.trim(); }
function floatVal(id) { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; }
function intVal(id) { const v = parseInt(document.getElementById(id).value); return isNaN(v) ? null : v; }
</script>

</body>
</html>
